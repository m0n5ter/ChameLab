name: Firmware build

on:
  workflow_call:
    inputs:
      checkout-sha:
        required: false
        type: string
      publish-builder:
        description: Build and publish the firmware builder image
        required: false
        type: boolean
        default: true
    outputs:
      version:
        description: The firmware version, e.g. 2.3.2-cl, or 2.3.2-cl-dev.3 with firmware commits after it
        value: ${{ jobs.build_fw_builder.outputs.version }}

jobs:
  build_fw_builder:
    name: Build fw-builder Docker image
    runs-on: ubuntu-latest # Inherits permissions from caller
    outputs:
      image_ref: ${{ steps.published-image.outputs.image_ref || steps.local-image.outputs.image_ref }}
      version: ${{ steps.version.outputs.version }}
      # Cache keys of the built firmware: it is rebuilt only when firmware/ changes
      ultra_key: ${{ steps.keys.outputs.ultra }}
      lite_key: ${{ steps.keys.outputs.lite }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha == null && github.sha || inputs.checkout-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Work out the firmware version
        id: version
        # firmware/VERSION is bumped only when the firmware changes; commits to firmware/ after
        # the bump make a development version. A release must not ship those under the old one.
        run: |
          version=$(tr -d '\r\n' < firmware/VERSION)
          bump=$(git log -1 --format=%H -- firmware/VERSION)
          changes=$(git rev-list --count "$bump..HEAD" -- firmware)
          if (( changes > 0 )); then
            if [[ $GITHUB_REF == refs/tags/v* ]]; then
              echo "::error::firmware/ has $changes commit(s) since firmware/VERSION ($version) last changed; bump it before releasing"
              exit 1
            fi
            version=$version-dev.$changes
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The firmware is built only when firmware/ changes (or this workflow): the packages are cached
      # under a hash of it. Its git version names the commit it was last built at. Bump v1 to force
      # a rebuild.
      - name: Work out the cache keys
        id: keys
        run: |
          hash=${{ hashFiles('firmware/**', '!firmware/objects/**', '.github/workflows/build_firmware.yml') }}
          echo "ultra=firmware-v1-ultra-$hash" >> "$GITHUB_OUTPUT"
          echo "lite=firmware-v1-lite-$hash" >> "$GITHUB_OUTPUT"
      - name: Look for built Ultra firmware
        id: ultra
        uses: actions/cache/restore@v6
        with:
          # The same paths as where build_fw saves them: they are part of the cache's identity
          path: |
            firmware/objects/*.hex
            firmware/objects/*.zip
          key: ${{ steps.keys.outputs.ultra }}
          lookup-only: true
      - name: Look for built Lite firmware
        id: lite
        uses: actions/cache/restore@v6
        with:
          # The same paths as where build_fw saves them: they are part of the cache's identity
          path: |
            firmware/objects/*.hex
            firmware/objects/*.zip
          key: ${{ steps.keys.outputs.lite }}
          lookup-only: true
      - name: Decide whether the builder image is needed
        id: need
        run: echo "build=${{ steps.ultra.outputs.cache-hit != 'true' || steps.lite.outputs.cache-hit != 'true' }}" >> "$GITHUB_OUTPUT"
      - name: ghcr.io login
        if: ${{ inputs.publish-builder && steps.need.outputs.build == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        if: ${{ inputs.publish-builder && steps.need.outputs.build == 'true' }}
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-fw-builder
      - name: Build and push Docker images
        if: ${{ inputs.publish-builder && steps.need.outputs.build == 'true' }}
        id: push
        uses: docker/build-push-action@v7
        with:
          context: firmware
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Docker image for this workflow
        if: ${{ !inputs.publish-builder && steps.need.outputs.build == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: firmware
          tags: chameleonultra-fw-builder:pr
          outputs: type=docker,dest=${{ runner.temp }}/fw-builder.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Upload Docker image
        if: ${{ !inputs.publish-builder && steps.need.outputs.build == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: firmware-builder-image
          path: ${{ runner.temp }}/fw-builder.tar
          retention-days: 1
      - name: Use local builder image
        if: ${{ !inputs.publish-builder && steps.need.outputs.build == 'true' }}
        id: local-image
        run: echo "image_ref=chameleonultra-fw-builder:pr" >> "$GITHUB_OUTPUT"
      - name: Use published builder image
        if: ${{ inputs.publish-builder && steps.need.outputs.build == 'true' }}
        id: published-image
        env:
          IMAGE: ghcr.io/${{ github.repository }}-fw-builder
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "image_ref=${IMAGE,,}@${DIGEST}" >> "$GITHUB_OUTPUT"
  build_fw:
    name: Build firmware
    runs-on: ubuntu-latest
    needs: build_fw_builder
    permissions:
      contents: read
    strategy:
      matrix:
        device_type: [ultra, lite]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha == null && github.sha || inputs.checkout-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Restore the firmware built from this source
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            firmware/objects/*.hex
            firmware/objects/*.zip
          key: ${{ matrix.device_type == 'ultra' && needs.build_fw_builder.outputs.ultra_key || needs.build_fw_builder.outputs.lite_key }}
      - name: Download Docker image
        if: ${{ !inputs.publish-builder && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: firmware-builder-image
          path: ${{ runner.temp }}
      - name: Load Docker image
        if: ${{ !inputs.publish-builder && steps.cache.outputs.cache-hit != 'true' }}
        run: docker load --input "${{ runner.temp }}/fw-builder.tar"
      - name: Build firmware
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm -v ${PWD}:/workdir -e CURRENT_DEVICE_TYPE=${{ matrix.device_type }} "${{ needs.build_fw_builder.outputs.image_ref }}" firmware/build.sh
      - name: Upload built binaries
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.device_type }}-firmware
          path: firmware/objects/*.hex
      - name: Unzip dfu images
        run: |
          sudo chown -R $USER:$USER firmware/objects
          mkdir firmware/objects/${{ matrix.device_type }}-dfu-app
          mkdir firmware/objects/${{ matrix.device_type }}-dfu-full
          unzip firmware/objects/${{ matrix.device_type }}-dfu-app.zip -d firmware/objects/${{ matrix.device_type }}-dfu-app
          unzip firmware/objects/${{ matrix.device_type }}-dfu-full.zip -d firmware/objects/${{ matrix.device_type }}-dfu-full
      - name: Upload dfu app image
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.device_type }}-dfu-app
          path: firmware/objects/${{ matrix.device_type }}-dfu-app/*
      - name: Upload dfu full image
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.device_type }}-dfu-full
          path: firmware/objects/${{ matrix.device_type }}-dfu-full/*
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-${{ matrix.device_type }}
          path: firmware/objects/*.zip
