name: Push handler

on:
  push:

concurrency:
  group: push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware_pipeline:
    name: Build Firmware
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/build_firmware.yml
  client_pipeline:
    name: Build Client
    permissions:
      contents: read
    uses: ./.github/workflows/build_client.yml
  gui_pipeline:
    name: Build GUI
    permissions:
      contents: read
    uses: ./.github/workflows/build_gui.yml
    # The Android signing key (ANDROID_KEYSTORE_*) lives in the repository secrets
    secrets: inherit
  create_dev_release:
    permissions:
      contents: write
    name: Create dev pre-release with artifacts
    runs-on: ubuntu-latest
    # The CLI build is optional: hosted macOS runners are sometimes not available at all
    if: always() && github.ref == 'refs/heads/main' && needs.firmware_pipeline.result == 'success' && needs.gui_pipeline.result == 'success'
    needs:
      - firmware_pipeline
      - client_pipeline
      - gui_pipeline
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-artifacts-*
          merge-multiple: true
          path: release-artifacts
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Put the versions into the file names
        env:
          APP_VERSION: ${{ needs.gui_pipeline.outputs.version }}
          FW_VERSION: ${{ needs.firmware_pipeline.outputs.version }}
        run: dotnet run --project software/chamelab/ChameLab.Tools -c Release -- name-release-files release-artifacts "$APP_VERSION" "$FW_VERSION"
      - name: Checksum the files
        id: checksums
        run: |
          # Lets people check a download that won't install or unpack
          {
            echo 'sha256<<EOF'
            (cd release-artifacts && sha256sum -- *)
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Drop the previous dev release
        # Uploading only adds and replaces files, so renamed or dropped ones would linger
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete dev --yes || true
      - name: Upload to dev release
        uses: softprops/action-gh-release@v3
        with:
          # The app version counts the commits since the last release (1.0.7-dev.N)
          body: |
            ChameLab v${{ needs.gui_pipeline.outputs.version }} with firmware v${{ needs.firmware_pipeline.outputs.version }}, built from the latest `main` commit.
            For development purposes only.
            These are not tested, here be dragons.
            Built from commit ${{ github.sha }}

            SHA-256:
            ```
            ${{ steps.checksums.outputs.sha256 }}
            ```
          tag_name: dev
          name: ChameLab v${{ needs.gui_pipeline.outputs.version }} (development)
          draft: false
          prerelease: true
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-artifacts/*
      - name: Fix up release tag
        run: |
          git tag -f dev
          git push origin refs/tags/dev --force
  deploy_site:
    name: Deploy the website
    # After the dev release, whose web app the site serves; the site's own changes go out even
    # when the dev release failed
    if: always() && github.ref == 'refs/heads/main' && needs.gui_pipeline.result == 'success'
    needs: [gui_pipeline, create_dev_release]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy_site.yml
  create_release:
    permissions:
      contents: write
      # Starts the website deployment with this release's web app
      actions: write
    name: Create tagged release with artifacts
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.firmware_pipeline.result == 'success' && needs.gui_pipeline.result == 'success'
    needs:
      - firmware_pipeline
      - client_pipeline
      - gui_pipeline
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-artifacts-*
          merge-multiple: true
          path: release-artifacts
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Put the versions into the file names
        env:
          APP_VERSION: ${{ needs.gui_pipeline.outputs.version }}
          FW_VERSION: ${{ needs.firmware_pipeline.outputs.version }}
        run: dotnet run --project software/chamelab/ChameLab.Tools -c Release -- name-release-files release-artifacts "$APP_VERSION" "$FW_VERSION"
      - name: Checksum the files
        id: checksums
        run: |
          # Lets people check a download that won't install or unpack
          {
            echo 'sha256<<EOF'
            (cd release-artifacts && sha256sum -- *)
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Upload to tagged release
        uses: softprops/action-gh-release@v3
        with:
          # The tag is the app version; ChameLab reads the firmware version from the first line
          body: |
            ChameLab ${{ github.ref_name }} with firmware v${{ needs.firmware_pipeline.outputs.version }}
            - `ultra-dfu-app-<firmware>.zip` / `lite-dfu-app-<firmware>.zip`: firmware update (ChameLab installs it from the Dashboard)
            - `chamelab-<version>-<os>.zip`: ChameLab for desktop
            - `chamelab-<version>-android-arm64.apk`: ChameLab for Android (most phones); `-android-arm.apk` for 32-bit Android
            - `client-<version>-<os>.zip`: command line client
            - `chamelab-<version>-web.zip`: the web app, as the website serves it
            Built from commit ${{ github.sha }}

            SHA-256:
            ```
            ${{ steps.checksums.outputs.sha256 }}
            ```
          name: ChameLab ${{ github.ref_name }}
          draft: false
          # The newest release is the latest, whatever older tags say
          make_latest: true
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          append_body: true
          files: release-artifacts/*
      - name: Deploy the website with this web app
        # From main: the github-pages environment takes deployments from main only
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy_site.yml --repo "$GITHUB_REPOSITORY" --ref main

  announce_release:
    name: Announce the release
    # always(): an optional job that did not run (the macOS CLI) would otherwise skip this one
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.create_release.result == 'success'
    needs: create_release
    permissions:
      contents: read
    uses: ./.github/workflows/announce_release.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  publish_google_play:
    name: Upload to Google Play
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.create_release.result == 'success'
    needs: create_release
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/publish_google_play.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  start_feature_freeze:
    name: Start the next PR review cycle
    # Upstream's review process; forks don't run it
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'RfidResearchGroup/ChameleonUltra'
    needs: create_release
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/pr_review_cycle.yml
    with:
      start_feature_freeze: true
