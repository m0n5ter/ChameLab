name: Client build

on:
  workflow_call:
    inputs:
      checkout-sha:
        required: false
        type: string

jobs:
  build_client:
    name: Build client (${{ matrix.name }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runner: windows-latest
            rid: win-x64
          - name: linux
            runner: ubuntu-latest
            rid: linux-x64
          - name: macos
            runner: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha == null && github.sha || inputs.checkout-sha }}
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify generated recovery circuits
        run: dotnet run --project software/chamelab/ChameLab.Tools -c Release -- generate-hardnested --check
      - name: Test CLI and protocol contracts
        run: dotnet test software/chamelab/ChameLab.Cli.Tests -c Release --nologo
      - name: Publish standalone client
        run: dotnet publish software/chamelab/ChameLab.Cli -c Release -r ${{ matrix.rid }} --self-contained true -o software/dist --nologo
      - name: Smoke test published client
        run: ./software/dist/chamelab -c "dump_help" -c "hf mf hardnested --help"
      - name: Upload built client
        uses: actions/upload-artifact@v7
        with:
          name: client-${{ matrix.name }}
          path: software/dist/*
      - name: Package client for release
        run: dotnet run --project software/chamelab/ChameLab.Tools -c Release --no-build -- zip software/dist client-${{ matrix.name }}.zip
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-${{ matrix.name }}
          path: client-${{ matrix.name }}.zip
