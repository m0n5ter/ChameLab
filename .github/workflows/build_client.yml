# This is just a placeholder while the whole PyInstaller thing gets figured out
name: Client build

on:
  workflow_call:
    inputs:
      checkout-sha:
        required: false
        type: string

jobs:
  build_client:
    name: Build client
    permissions:
      contents: read
    strategy:
      matrix:
        # Hosted macOS runners are often not available at all, so macOS is only built for tagged releases
        name: ${{ fromJSON(startsWith(github.ref, 'refs/tags/v') && '["windows", "linux", "macos"]' || '["windows", "linux"]') }}
    runs-on: ${{ matrix.name == 'linux' && 'ubuntu' || matrix.name }}-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha == null && github.sha || inputs.checkout-sha }}
          persist-credentials: false
      # The client is built only when its sources change: software/dist is cached under a hash of the
      # script, the native code, the spec, the requirements and this workflow. A cached client keeps the
      # PyInstaller and packages it was built with. Bump v1 to force a rebuild.
      - name: Restore the client built from this source
        id: cache
        uses: actions/cache@v6
        with:
          path: software/dist
          key: client-v1-${{ matrix.name }}-${{ hashFiles('software/script/**', '!software/script/**/__pycache__/**', 'software/src/**', 'software/pyinstaller.spec', '.github/workflows/build_client.yml') }}
      - name: Set up Python
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install PyInstaller and client dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r software/script/requirements.txt
      - name: Compile native code
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd software/src
          mkdir out
          cd out
          cmake ..
          cmake --build . --config Release
      - name: Run PyInstaller
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd software
          pyinstaller pyinstaller.spec
      - name: Upload built client
        uses: actions/upload-artifact@v7
        with:
          name: client-${{ matrix.name }}
          path: software/dist/*
      - name: Zip up client for release
        if: runner.os == 'Windows'
        run: Compress-Archive -Path software\dist\* -DestinationPath client-windows.zip
      - name: Zip up client for release
        if: runner.os != 'Windows'
        run: (cd software/dist && zip -r "$OLDPWD/client-${{ matrix.name }}.zip" .)
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-${{ matrix.name }}
          path: client-${{ matrix.name }}.zip
