name: GUI build

on:
  workflow_call:
    inputs:
      checkout-sha:
        required: false
        type: string
    outputs:
      version:
        description: The app version, e.g. 1.0.7, or 1.0.7-dev.N with N commits after the release
        value: ${{ jobs.version.outputs.version }}

jobs:
  version:
    name: Work out the GUI version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha == null && github.sha || inputs.checkout-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Work out the version
        id: version
        run: |
          # Release tags carry the app version (the firmware has its own in firmware/VERSION):
          # v1.0.7 -> 1.0.7, commits after it -> 1.0.7-dev.N; no tag at all -> 0.0.0-dev.<all commits>
          # code is the Android versionCode: MMmmpp + commits, so every build installs over the last
          desc=$(git describe --tags --match 'v*.*' 2>/dev/null || true)
          if [[ $desc =~ ^v([0-9]+)\.([0-9]+)(\.([0-9]+))?(-([0-9]+)-g[0-9a-f]+)?$ ]]; then
            major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[4]:-0} commits=${BASH_REMATCH[6]:-0}
          else
            major=0 minor=0 patch=0 commits=$(git rev-list --count HEAD)
          fi
          version=$major.$minor.$patch
          [[ $commits != 0 || -z $desc ]] && version=$version-dev.$commits
          # After a tag the commits only fill the pp slot; untagged, they are the whole code
          [[ -n $desc ]] && (( commits > 99 )) && commits=99
          code=$(( major * 1000000 + minor * 10000 + patch * 100 + commits ))
          # Releases up to v2.3.2 were tagged with the firmware version; keep codes above theirs
          [[ -n $desc && $major -lt 2 ]] && code=$(( code + 10000000 ))
          # Android rejects a versionCode below 1
          (( code < 1 )) && code=1
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test_managed_hardnested:
    name: Managed hardnested (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha == null && github.sha || inputs.checkout-sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify recovery and scalar/SIMD equivalence
        run: dotnet test software/chamelab/ChameLab.Tests -c Release --filter FullyQualifiedName~Hardnested

  build_desktop:
    name: Build GUI (${{ matrix.rid }})
    runs-on: ubuntu-latest
    needs: [version, test_managed_hardnested]
    permissions:
      contents: read
    strategy:
      matrix:
        rid: [win-x64, linux-x64, osx-arm64, osx-x64]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha == null && github.sha || inputs.checkout-sha }}
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: >
          dotnet publish software/chamelab/ChameLab.Desktop/ChameLab.Desktop.csproj
          -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ needs.version.outputs.version }}
          -o publish
      - name: Zip up GUI for release
        # The assembly can't be called ChameLab (that's the shared library), so only the
        # single-file executable is renamed
        run: |
          for f in publish/ChameLab.Desktop publish/ChameLab.Desktop.exe; do
            [[ -e $f ]] && mv "$f" "${f/ChameLab.Desktop/ChameLab}"
          done
          (cd publish && zip -r "$OLDPWD/chamelab-${{ matrix.rid }}.zip" . -x '*.pdb')
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-gui-${{ matrix.rid }}
          path: chamelab-${{ matrix.rid }}.zip

  build_browser:
    name: Build GUI (browser)
    runs-on: ubuntu-latest
    needs: [version, test_managed_hardnested]
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha == null && github.sha || inputs.checkout-sha }}
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install the WebAssembly workload
        # Links SkiaSharp's native assets into the WASM output. Restored from the project, not
        # installed by name: when the runner image ships a newer SDK (11) than the target (net10),
        # the project needs wasm-tools-net10, and plain wasm-tools would be the SDK's own version.
        run: dotnet workload restore software/chamelab/ChameLab.Browser/ChameLab.Browser.csproj
      - name: Publish
        run: >
          dotnet publish software/chamelab/ChameLab.Browser/ChameLab.Browser.csproj
          -c Release
          -p:Version=${{ needs.version.outputs.version }}
          -o publish
      - name: Verify managed hardnested in a browser worker
        run: |
          npm install --prefix "$RUNNER_TEMP/hardnested-browser-tests" playwright
          "$RUNNER_TEMP/hardnested-browser-tests/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/hardnested-browser-tests/node_modules" node software/chamelab/ChameLab.Browser/tests/browser-worker.cjs publish/wwwroot software/chamelab/ChameLab.Tests/Reference/hardnested_capture.txt
      - name: Package the web app
        # Released with the other files; the website serves the stable and the development one
        run: (cd publish/wwwroot && zip -qr "$OLDPWD/chamelab-web.zip" .)
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-gui-browser
          path: chamelab-web.zip

  build_android:
    name: Build GUI (android)
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha == null && github.sha || inputs.checkout-sha }}
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the Android workload
        run: dotnet workload install android
      - name: Prepare the signing key
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Without the secrets the APK gets the SDK's throwaway debug key: it installs,
          # but can't be updated in place by an APK signed on another runner.
          if [[ -n $KEYSTORE ]]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "args=-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/release.keystore -p:AndroidSigningKeyAlias=$KEY_ALIAS -p:AndroidSigningKeyPass=env:KEYSTORE_PASSWORD -p:AndroidSigningStorePass=env:KEYSTORE_PASSWORD"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, the APK is signed with a debug key"
          fi
      - name: Publish
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # One APK per ABI, half the size of a universal one: arm64 for most phones,
          # arm for 32-bit systems (common on Android 8 and older devices)
          for rid in android-arm64 android-arm; do
            dotnet publish software/chamelab/ChameLab.Android/ChameLab.Android.csproj \
              -c Release -f net10.0-android -r "$rid" \
              -p:Version=${{ needs.version.outputs.version }} \
              -p:ApplicationDisplayVersion=${{ needs.version.outputs.version }} \
              -p:ApplicationVersion=${{ needs.version.outputs.code }} \
              ${{ steps.signing.outputs.args }} \
              -o "publish/$rid"
            cp publish/"$rid"/*-Signed.apk "chamelab-$rid.apk"
          done
      - name: Publish the Google Play bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # One .aab with every ABI; Play splits it per device. Signed with the same key as the
          # APKs (the upload key), so it is not a release asset, only a workflow artifact.
          dotnet publish software/chamelab/ChameLab.Android/ChameLab.Android.csproj \
            -c Release -f net10.0-android \
            -p:AndroidPackageFormat=aab \
            -p:Version=${{ needs.version.outputs.version }} \
            -p:ApplicationDisplayVersion=${{ needs.version.outputs.version }} \
            -p:ApplicationVersion=${{ needs.version.outputs.code }} \
            ${{ steps.signing.outputs.args }} \
            -o publish/aab
          cp publish/aab/*-Signed.aab chamelab-google-play.aab
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-gui-android
          path: chamelab-android-*.apk
      - name: Upload the Google Play bundle
        uses: actions/upload-artifact@v7
        with:
          name: google-play-bundle
          path: chamelab-google-play.aab

  build_ios:
    name: Build GUI (iOS, ${{ matrix.rid }})
    runs-on: macos-26
    needs: version
    # Keep the Apple toolchain and workload set together. Installing the latest
    # iOS workload can require an Xcode not yet available on hosted runners.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      IOS_DOTNET_VERSION: '10.0.302'
      IOS_WORKLOAD_VERSION: '10.0.302.0'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        rid: [ios-arm64, iossimulator-arm64]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha == null && github.sha || inputs.checkout-sha }}
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.IOS_DOTNET_VERSION }}
      - name: Select the pinned .NET SDK and Xcode
        run: |
          dotnet new globaljson --sdk-version "$IOS_DOTNET_VERSION" --roll-forward disable
          dotnet --version
          xcodebuild -version
      - name: Install the iOS workload
        run: dotnet workload install ios --version "$IOS_WORKLOAD_VERSION"
      - name: Build the app with the managed hardnested engine
        run: >
          dotnet build software/chamelab/ChameLab.iOS/ChameLab.iOS.csproj
          -c Release -r ${{ matrix.rid }}
          -p:Version=${{ needs.version.outputs.version }}
          -p:EnableCodeSigning=false
      - name: Upload the unsigned app
        uses: actions/upload-artifact@v7
        with:
          name: gui-${{ matrix.rid }}-unsigned
          path: software/chamelab/ChameLab.iOS/bin/Release/net10.0-ios/${{ matrix.rid }}/*.app
